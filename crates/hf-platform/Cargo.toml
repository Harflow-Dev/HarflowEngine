[package]
name = "hf-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
hf-application = { path = "../hf-application" }
hf-domain = { path = "../hf-domain" }

[target.'cfg(target_os = "macos")'.dependencies]
libproc = { version = "=0.14.11", default-features = false }
sysctl = { version = "=0.7.1", default-features = false }
nix = { version = "=0.31.3", default-features = false, features = ["fs", "poll", "process", "signal", "socket"] }
