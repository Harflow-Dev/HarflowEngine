[workspace]
resolver = "3"
members = ["crates/*", "tools/hf-architecture"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
too_many_lines = "deny"
